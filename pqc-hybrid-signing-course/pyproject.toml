[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-hybrid-signing-course"
version = "0.2.0"
description = "Hands-on course on hybrid signatures in the AIMarket stack: why PQ alone is not enough, how dual keys bind a receipt, and how to verify without trusting the hub."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AI-Factory" }]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
pqc = ["dilithium-py"]
dev = ["pytest>=8"]
all = ["pqc-hybrid-signing-course[pqc,dev]"]

[project.urls]
Homepage = "https://alexar76.github.io/aimarket-courses/pqc-hybrid-signing-course/"
Documentation = "https://alexar76.github.io/aimarket-courses/pqc-hybrid-signing-course/"
Repository = "https://github.com/alexar76/aimarket-courses"
Issues = "https://github.com/alexar76/aimarket-courses/issues"

[tool.setuptools.packages.find]
include = ["courselib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
